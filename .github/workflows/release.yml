name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Verify tag and manifest version
        run: test "${GITHUB_REF_NAME}" = "$(node -p "require('./manifest.json').version")"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            main.js
            manifest.json
            styles.css
      - name: Publish release after assets are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
      - name: Verify anonymous BRAT release metadata
        run: |
          assets="$(curl --fail --silent --show-error \
            -H 'User-Agent: Obsidian/BRAT-Plugin' \
            -H 'Accept: application/vnd.github.v3+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            | jq -r '[.assets[].name] | sort | join(",")')"
          test "${assets}" = "main.js,manifest.json,styles.css"
